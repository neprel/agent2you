; The three processes that make one agent. Read bottom-up: hermes is the only
; one anybody talks to, and the two below it exist to give hermes something it
; can talk to.
;
; All three log to the container's stdout (/dev/fd/1, maxbytes 0 to disable
; rotation of a pipe), so `docker logs agent-<name>` shows the whole stack in one
; stream. Per-process log files inside the container would be invisible to
; Portainer and lost with the container.
;
; startsecs is 10 everywhere: each of these can fail on its config file within a
; second or two, and a process that dies that fast must be reported as FATAL
; rather than restarted forever. autorestart=unexpected leaves a clean exit alone.

[program:acp2api]
; The ACP adapter: one OpenAI model id per coding CLI, each spending its own
; subscription. Started first -- litellm probes its models at boot.
command=/usr/local/bin/acp2api --config /config/acp2api.yaml
priority=10
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:litellm]
; The failover chain. Bound to 127.0.0.1: the whole namespace is shared with the
; VPN container, so "localhost" here is already the only place it should listen.
command=/opt/agent/litellm/bin/litellm --config /config/litellm.yaml --host 127.0.0.1 --port %(ENV_LITELLM_PORT)s
priority=20
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:hermes]
; The employee. `gateway run` is the foreground form -- the systemd/launchd
; variants (`gateway start`) manage a service manager that does not exist here.
;
; It starts last but does not WAIT for the two below it, because supervisord has
; no dependency ordering. That is fine: hermes only dials litellm when a message
; arrives, and the gateway reconnects platforms on its own.
command=/opt/agent/hermes-agent/venv/bin/hermes gateway run
directory=/work
priority=30
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:fleet-roster]
; Keeps the peer roster at the bottom of SOUL.md current WITHOUT a restart.
;
; /fleet is a bind mount of ai/config/agents, so a `git pull` on the host makes a
; newly added agent visible inside every running container at once; Hermes reads
; SOUL.md once per SESSION rather than once per process, so the next conversation
; picks the rewrite up. Between them, introducing a colleague costs the rest of
; the fleet nothing -- which is the whole reason this is a process and not just a
; line in the entrypoint.
;
; A minute is generous for a fleet that changes when a human runs `git pull`, and
; the script writes only when the result actually differs, so the steady state is
; one directory scan and no I/O. priority 40: last, and nothing waits on it.
command=/bin/sh -c 'while :; do /opt/agent/bin/fleet-roster.py "${AGENT_FLEET_DIR:-/fleet}" /config/SOUL.md "${HERMES_HOME:-/root/.hermes}/SOUL.md" "${AGENT_NAME}"; sleep 60; done'
priority=40
autostart=true
; `unexpected` everywhere else, but this loop must never exit at all: if it does,
; the roster silently freezes at whatever it last wrote and nothing says so.
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
