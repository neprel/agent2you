[program:litellm]
; The failover chain. Bound to 127.0.0.1: the whole namespace is shared with the
; VPN container, so "localhost" here is already the only place it should listen.
command=/opt/agent/litellm/bin/litellm --config /config/litellm.yaml --host 127.0.0.1 --port %(ENV_LITELLM_PORT)s
priority=20
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
