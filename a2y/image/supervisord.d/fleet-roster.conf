[program:fleet-roster]
; Keeps the peer roster at the bottom of SOUL.md current WITHOUT a restart.
;
; /fleet is a bind mount of ai/config/agents, so a `git pull` on the host makes a
; newly added agent visible inside every running container at once; Hermes reads
; SOUL.md once per SESSION rather than once per process, so the next conversation
; picks the rewrite up. Between them, introducing a colleague costs the rest of
; the fleet nothing -- which is the whole reason this is a process and not just a
; line in the entrypoint.
;
; A minute is generous for a fleet that changes when a human runs `git pull`, and
; the script writes only when the result actually differs, so the steady state is
; one directory scan and no I/O. priority 40: last, and nothing waits on it.
command=/bin/sh -c 'while :; do /opt/agent/bin/fleet-roster.py "${AGENT_FLEET_DIR:-/fleet}" /config/SOUL.md "${HERMES_HOME:-/root/.hermes}/SOUL.md" "${AGENT_NAME}"; sleep 60; done'
priority=40
autostart=true
; `unexpected` everywhere else, but this loop must never exit at all: if it does,
; the roster silently freezes at whatever it last wrote and nothing says so.
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
