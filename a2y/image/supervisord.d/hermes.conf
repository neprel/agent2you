[program:hermes]
; The employee. `gateway run` is the foreground form -- the systemd/launchd
; variants (`gateway start`) manage a service manager that does not exist here.
;
; It starts last but does not WAIT for the two below it, because supervisord has
; no dependency ordering. That is fine: hermes only dials litellm when a message
; arrives, and the gateway reconnects platforms on its own.
command=/opt/agent/hermes-agent/venv/bin/hermes gateway run
directory=/work
priority=30
autostart=true
autorestart=unexpected
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
