display_information:
  name: agent2you-agent
features:
  bot_user:
    display_name: agent2you-agent
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot: [app_mentions:read, channels:history, chat:write, files:read, files:write, groups:history, im:history, im:read, im:write, mpim:history, reactions:read, reactions:write, users:read]
settings:
  event_subscriptions:
    bot_events: [app_mention, message.channels, message.groups, message.im, message.mpim]
  socket_mode_enabled: true
