# agent2you fleet CI for GitHub. Delete this file when this repo uses Gitea.
name: a2y fleet
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
      - name: Render and reject drift
        run: |
          version="$(tr -d '[:space:]' < .a2y-version)"
          uvx --from "agent2you==$version" a2y render
          git diff --exit-code -- deploy || { echo 'manifests and deploy/ disagree: run a2y render and commit'; exit 1; }
      - name: Offline doctor (no Docker, no secrets)
        run: |
          cp deploy/example.env deploy/.env
          chmod 600 deploy/.env
          version="$(tr -d '[:space:]' < .a2y-version)"
          uvx --from "agent2you==$version" a2y doctor --offline
